main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.sub{margin:0;color:rgba(255,255,255,.85);text-shadow:0 1px 6px rgba(0,0,0,.5)}
.me{width:68px;height:68px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--y);box-shadow:0 6px 16px rgba(0,0,0,.45),0 0 0 4px rgba(255,255,255,.15)}
.glass,.file,.msg,.drop{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.28);box-shadow:0 8px 24px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.35);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:14px}
.drop{display:block;border-style:dashed;padding:28px 16px;text-align:center;cursor:pointer}
.drop.over,.drop:focus-within{border-color:var(--y)}
.drop strong{display:block;font-size:1.05rem;color:var(--y)}
.drop span{color:rgba(255,255,255,.85);font-size:.9rem}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
section{margin-top:20px}
h2{font-size:1rem;margin:0 0 8px;color:var(--y);text-shadow:0 1px 6px rgba(0,0,0,.5)}
.file{padding:10px 12px;margin-bottom:10px}
.fh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.fn{font-weight:600;overflow-wrap:anywhere}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
input[type=checkbox],input[type=radio]{margin-top:5px;accent-color:var(--y);width:18px;height:18px;flex:none}
.sheet{color:rgba(255,255,255,.75);font-size:.92rem}
.modes{display:grid;gap:10px;margin-bottom:6px}
.btn3d,.tab,.mode,.rm,.bar button,button.go{font:inherit;color:var(--w);cursor:pointer;border:1px solid rgba(255,255,255,.45);border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,.12) 48%,rgba(255,255,255,.05) 100%);box-shadow:0 7px 0 rgba(0,0,0,.28),0 12px 20px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.7),inset 0 -6px 10px rgba(0,0,0,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);text-shadow:0 1px 3px rgba(0,0,0,.55);transition:transform .08s,box-shadow .08s;margin-bottom:7px}
.mode{display:flex;gap:10px;padding:12px 14px}
.mode small{display:block;color:rgba(255,255,255,.85);font-weight:400}
.mode:has(input:checked){border-color:var(--y);color:var(--y);box-shadow:0 7px 0 rgba(0,0,0,.28),0 12px 20px rgba(0,0,0,.35),0 0 0 2px var(--y),inset 0 2px 0 rgba(255,255,255,.7),inset 0 -6px 10px rgba(0,0,0,.22)}
.rm,.bar button{padding:6px 12px;font-size:.9rem;border-radius:10px;box-shadow:0 4px 0 rgba(0,0,0,.28),0 7px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -4px 6px rgba(0,0,0,.2);margin-bottom:4px}
.rm{color:var(--y)}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.name{width:100%;font:inherit;color:var(--w);padding:11px 14px;border:1px solid rgba(255,255,255,.4);border-radius:12px;background:rgba(0,0,0,.28);box-shadow:inset 0 3px 8px rgba(0,0,0,.35)}
button.go{width:100%;margin-top:20px;font-weight:700;padding:15px;color:var(--y);font-size:1.05rem}
.tab:active,.mode:active,.rm:active,.bar button:active,button.go:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28),0 4px 8px rgba(0,0,0,.3),inset 0 2px 6px rgba(0,0,0,.3)}
button.go:disabled{opacity:.45}
button:focus-visible,input:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.msg{margin-top:14px;padding:10px 12px;font-size:.95rem}
.msg.warn{color:var(--y)}.msg.err{color:#ffb3ab}
.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{flex:1;padding:11px 4px;font-size:.92rem;margin:0}.tab.on{color:var(--y);border-color:var(--y)}.acts{display:flex;gap:6px;flex:none}.acts .rm{margin:0}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
var files=[];
var $=function(i){return document.getElementById(i)};
function say(t,c){$("msg").innerHTML=t?'<div class="msg '+(c||"")+'">'+t+'</div>':""}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function read(list){
  say("Đang đọc file…");
  var jobs=Array.prototype.map.call(list,function(f){
    return f.arrayBuffer().then(function(b){
      var wb=XLSX.read(b,{type:"array",cellDates:true});
      files.push({name:f.name,wb:wb,on:wb.SheetNames.map(function(){return true})});
    }).catch(function(){say("Không đọc được file <b>"+esc(f.name)+"</b>. Kiểm tra lại file có bị hỏng hoặc đặt mật khẩu không.","err")});
  });
  Promise.all(jobs).then(function(){render();if(files.length)say("")});
}

function rowsOf(ws){
  var a=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
  return a.filter(function(r){return r.some(function(c){return c!==""&&c!==null})});
}

function render(){
  var box=$("files");
  if(!files.length){box.innerHTML="";$("opts").hidden=true;return}
  var h='<section><div class="bar"><h2 style="margin:0;flex:1">Sheet cần gộp</h2><button id="all">Chọn tất cả</button><button id="none">Bỏ chọn</button></div>';
  files.forEach(function(f,i){
    h+='<div class="file"><div class="fh"><span class="fn">'+esc(f.name)+'</span><button class="rm" data-rm="'+i+'">Xóa</button></div>';
    f.wb.SheetNames.forEach(function(s,j){
      var n=Math.max(rowsOf(f.wb.Sheets[s]).length-1,0);
      h+='<label class="opt"><input type="checkbox" data-f="'+i+'" data-s="'+j+'"'+(f.on[j]?" checked":"")+'><span>'+esc(s)+' <span class="sheet">– '+n+' dòng dữ liệu</span></span></label>';
    });
    h+='</div>';
  });
  box.innerHTML=h+'</section>';
  $("opts").hidden=false;
}

$("files").addEventListener("click",function(e){
  var t=e.target;
  if(t.dataset.rm!==undefined){files.splice(+t.dataset.rm,1);render();say("")}
  if(t.id==="all"||t.id==="none"){files.forEach(function(f){f.on=f.on.map(function(){return t.id==="all"})});render()}
});
$("files").addEventListener("change",function(e){
  var t=e.target;if(t.dataset.f!==undefined)files[+t.dataset.f].on[+t.dataset.s]=t.checked;
});
$("pick").addEventListener("change",function(e){read(e.target.files);e.target.value=""});
var ac;
function drip(t0,f0,f1,vol){
  var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;
  o.type="sine";
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(f1,t+0.09);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.32);
  o.connect(g);g.connect(ac.destination);
  o.start(t);o.stop(t+0.35);
}
function dropSound(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended")ac.resume();
    drip(0,520,1500,0.35);
    drip(0.16,420,1100,0.12);
  }catch(e){}
}
var dz=$("drop");
dz.addEventListener("click",dropSound);
["dragenter","dragover"].forEach(function(n){dz.addEventListener(n,function(e){e.preventDefault();dz.classList.add("over")})});
["dragleave","drop"].forEach(function(n){dz.addEventListener(n,function(e){e.preventDefault();dz.classList.remove("over")})});
dz.addEventListener("drop",function(e){read(e.dataTransfer.files)});
document.querySelectorAll('input[name="mode"]').forEach(function(r){
  r.addEventListener("change",function(){$("srcWrap").hidden=document.querySelector('input[name="mode"]:checked').value==="many"});
});

function picked(){
  var p=[];
  files.forEach(function(f){f.wb.SheetNames.forEach(function(s,j){if(f.on[j])p.push({file:f.name,sheet:s,ws:f.wb.Sheets[s]})})});
  return p;
}

function puff(t0,dur,type,f0,f1,vol){
  var n=Math.floor(ac.sampleRate*dur),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
  var s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),t=ac.currentTime+t0;
  s.buffer=b;f.type=type;
  f.frequency.setValueAtTime(f0,t);
  f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(ac.destination);
  s.start(t);
}
function fireSound(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended")ac.resume();
    var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type="sine";
    o.frequency.setValueAtTime(500,t);
    o.frequency.exponentialRampToValueAtTime(1800,t+0.28);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.07,t+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.32);
    var k=ac.createOscillator(),kg=ac.createGain();
    k.type="sine";
    k.frequency.setValueAtTime(170,t+0.3);
    k.frequency.exponentialRampToValueAtTime(40,t+0.6);
    kg.gain.setValueAtTime(0.5,t+0.3);
    kg.gain.exponentialRampToValueAtTime(0.0001,t+0.65);
    k.connect(kg);kg.connect(ac.destination);k.start(t+0.3);k.stop(t+0.7);
    puff(0.3,0.4,"lowpass",3500,300,0.7);
    for(var i=0;i<7;i++)puff(0.4+Math.random()*0.5,0.05,"highpass",3000+Math.random()*3000,2500,0.18);
  }catch(e){}
}
function dl(buf,filename){
  var u=URL.createObjectURL(new Blob([buf])),a=document.createElement("a");
  a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(u)},4000);
}
function saveFile(wb,name){
  var buf=XLSX.write(wb,{bookType:"xlsx",type:"array",cellDates:true});
  if(!window.claude||!claude.use){dl(buf,name+".xlsx");fireSound();$("msg").insertAdjacentHTML("beforeend",'<div class="msg">Đã tạo file <b>'+esc(name)+'.xlsx</b>.</div>');return}
  claude.use("downloads").then(function(d){
    if(!d){say("Không thể tải file ở chế độ xem này. Hãy mở app trong claude.ai.","err");return}
    return d.save({filename:name+".xlsx",data:buf}).then(function(){
      fireSound();
      $("msg").insertAdjacentHTML("beforeend",'<div class="msg">Đã lưu file <b>'+esc(name)+'.xlsx</b>.</div>');
    });
  }).catch(function(e){
    if(e&&e.code==="declined")say("Bạn đã hủy tải file. Bấm Gộp và tải về để thử lại.","warn");
    else say("Không tải được file: "+esc((e&&e.message)||"lỗi không xác định"),"err");
  });
}

$("go").addEventListener("click",function(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
  var p=picked();
  if(!p.length){say("Chưa chọn sheet nào. Hãy tích chọn ít nhất một sheet.","err");return}
  var mode=document.querySelector('input[name="mode"]:checked').value;
  var name=($("out").value||"Tong-hop").replace(/[\\/:*?"<>|]/g,"").trim()||"Tong-hop";
  var out=XLSX.utils.book_new();
  try{
    if(mode==="one"){
      var addSrc=$("src").checked,header=null,body=[],diff=0,empty=0;
      p.forEach(function(x){
        var a=rowsOf(x.ws);
        if(!a.length){empty++;return}
        var h=a[0],d=a.slice(1);
        if(!header)header=h;
        else if(h.length!==header.length||h.some(function(c,k){return String(c).trim()!==String(header[k]).trim()}))diff++;
        d.forEach(function(r){body.push(addSrc?[x.file,x.sheet].concat(r):r)});
      });
      if(!header){say("Các sheet đã chọn đều trống.","err");return}
      if(body.length>1048575){say("Tổng số dòng ("+body.length.toLocaleString("vi-VN")+") vượt giới hạn 1.048.575 dòng của Excel. Hãy chọn ít sheet hơn hoặc gộp theo từng nhóm.","err");return}
      var head=addSrc?["Tên file","Tên sheet"].concat(header):header;
      XLSX.utils.book_append_sheet(out,XLSX.utils.aoa_to_sheet([head].concat(body),{cellDates:true}),"Tổng hợp");
      saveFile(out,name);
      var m="Đã gộp <b>"+p.length+"</b> sheet thành 1 sheet với <b>"+body.length.toLocaleString("vi-VN")+"</b> dòng dữ liệu.";
      if(diff)m+=" Có <b>"+diff+"</b> sheet có tiêu đề khác sheet đầu tiên; dữ liệu vẫn được nối theo thứ tự cột, hãy kiểm tra lại.";
      if(empty)m+=" Bỏ qua "+empty+" sheet trống.";
      say(m,diff?"warn":"");
    }else{
      var used={};
      p.forEach(function(x){
        var base=(x.file.replace(/\.[^.]+$/,"")+"_"+x.sheet).replace(/[\\\/?*\[\]:]/g,"-").slice(0,28),n=base,k=1;
        while(used[n.toLowerCase()]){k++;n=base.slice(0,28-String(k).length-1)+"_"+k}
        used[n.toLowerCase()]=1;
        XLSX.utils.book_append_sheet(out,x.ws,n);
      });
      saveFile(out,name);
      say("Đã gộp <b>"+p.length+"</b> sheet vào 1 file. Mỗi sheet được đặt tên theo dạng <i>tên file_tên sheet</i>.");
    }
  }catch(err){say("Có lỗi khi gộp: "+esc(err.message),"err")}
});

document.querySelector(".tabs").addEventListener("click",function(e){
  var t=e.target.closest(".tab");if(!t)return;
  document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b===t)});
  ["pExcel","pImg","pPdf"].forEach(function(id){$(id).hidden=id!==t.dataset.t});
  say("");
});

function saveBytes(buf,filename,msg){
  if(!window.claude||!claude.use){dl(buf,filename);fireSound();say(msg+" Đã tạo <b>"+esc(filename)+"</b>.");return Promise.resolve()}
  return claude.use("downloads").then(function(d){
    if(!d){say("Không thể tải file ở chế độ xem này. Hãy mở app trong claude.ai.","err");return}
    return d.save({filename:filename,data:buf}).then(function(){fireSound();say(msg+" Đã lưu <b>"+esc(filename)+"</b>.")});
  }).catch(function(e){
    if(e&&e.code==="declined")say("Bạn đã hủy tải file. Bấm nút gộp để thử lại.","warn");
    else say("Không tải được file: "+esc((e&&e.message)||"lỗi không xác định"),"err");
  });
}

function mkTool(id,c){
  var box=$(id),items=[];
  box.innerHTML='<label class="drop"><input type="file" multiple accept="'+c.accept+'"><strong>'+c.title+'</strong><span>'+c.hint+'</span></label><div class="lst"></div><div class="ctl" hidden>'+(c.extra||"")+'<h2 style="margin-top:12px">Tên file kết quả</h2><input class="name" value="'+c.out+'" aria-label="Tên file kết quả"><button class="go">'+c.btn+'</button></div>';
  var dz2=box.querySelector(".drop"),inp=box.querySelector("input[type=file]"),lst=box.querySelector(".lst"),ctl=box.querySelector(".ctl"),nm=box.querySelector(".name"),go=box.querySelector(".go");
  function draw(){
    lst.innerHTML=items.length?'<section><h2>Thứ tự gộp (từ trên xuống dưới)</h2>'+items.map(function(it,i){
      return '<div class="file"><div class="fh"><span class="fn">'+(i+1)+'. '+esc(it.name)+' <span class="sheet">– '+Math.max(1,Math.round(it.size/1024)).toLocaleString("vi-VN")+' KB</span></span><span class="acts"><button class="rm" data-a="u" data-i="'+i+'" aria-label="Lên">↑</button><button class="rm" data-a="d" data-i="'+i+'" aria-label="Xuống">↓</button><button class="rm" data-a="x" data-i="'+i+'">Xóa</button></span></div></div>';
    }).join("")+'</section>':"";
    ctl.hidden=!items.length;
  }
  function add(list){
    var bad=0;
    Array.prototype.forEach.call(list,function(f){if(c.ok(f))items.push({file:f,name:f.name,size:f.size});else bad++});
    if(bad)say("Bỏ qua "+bad+" file không đúng loại.","warn");else say("");
    draw();
  }
  dz2.addEventListener("click",dropSound);
  inp.addEventListener("change",function(e){add(e.target.files);e.target.value=""});
  ["dragenter","dragover"].forEach(function(n){dz2.addEventListener(n,function(e){e.preventDefault();dz2.classList.add("over")})});
  ["dragleave","drop"].forEach(function(n){dz2.addEventListener(n,function(e){e.preventDefault();dz2.classList.remove("over")})});
  dz2.addEventListener("drop",function(e){add(e.dataTransfer.files)});
  lst.addEventListener("click",function(e){
    var t=e.target,i=+t.dataset.i,a=t.dataset.a;if(!a)return;
    if(a==="x")items.splice(i,1);
    if(a==="u"&&i>0)items.splice(i-1,2,items[i],items[i-1]);
    if(a==="d"&&i<items.length-1)items.splice(i,2,items[i+1],items[i]);
    draw();
  });
  go.addEventListener("click",function(){
    if(items.length<c.min){say(c.minMsg,"err");return}
    var name=(nm.value||c.out).replace(/[\\\/:*?"<>|]/g,"").trim()||c.out;
    try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
    say("Đang gộp, vui lòng chờ…");
    c.run(items.map(function(i){return i.file})).then(function(bytes){
      return saveBytes(bytes,name+".pdf",c.done(items.length));
    }).catch(function(e){say("Không gộp được: "+esc((e&&e.message)||e),"err")});
  });
}

var nCrop=0;
function smartRect(cv){
  var s=Math.min(1,400/Math.max(cv.width,cv.height)),sw=Math.max(1,Math.round(cv.width*s)),sh=Math.max(1,Math.round(cv.height*s));
  var t=document.createElement("canvas");t.width=sw;t.height=sh;
  var x=t.getContext("2d",{willReadFrequently:true});x.drawImage(cv,0,0,sw,sh);
  var d=x.getImageData(0,0,sw,sh).data,m=Math.max(2,Math.round(Math.min(sw,sh)*0.03)),R=[],G=[],B=[],i,j,p;
  for(j=0;j<sh;j++)for(i=0;i<sw;i++){
    if(i<m||j<m||i>=sw-m||j>=sh-m){p=(j*sw+i)*4;R.push(d[p]);G.push(d[p+1]);B.push(d[p+2])}
  }
  function med(a){a.sort(function(u,v){return u-v});return a[a.length>>1]}
  var br=med(R),bg=med(G),bb=med(B),rows=new Array(sh).fill(0),cols=new Array(sw).fill(0),dr,dg,db;
  for(j=0;j<sh;j++)for(i=0;i<sw;i++){
    p=(j*sw+i)*4;dr=d[p]-br;dg=d[p+1]-bg;db=d[p+2]-bb;
    if(dr*dr+dg*dg+db*db>2304){rows[j]++;cols[i]++}
  }
  var rt=Math.max(2,sw*0.012),ct=Math.max(2,sh*0.012);
  var y0=0,y1=sh-1,x0=0,x1=sw-1;
  while(y0<sh&&rows[y0]<rt)y0++;
  while(y1>y0&&rows[y1]<rt)y1--;
  while(x0<sw&&cols[x0]<ct)x0++;
  while(x1>x0&&cols[x1]<ct)x1--;
  if(y1-y0<sh*0.15||x1-x0<sw*0.15)return null;
  var pad=Math.round(Math.min(sw,sh)*0.02);
  x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(sw-1,x1+pad);y1=Math.min(sh-1,y1+pad);
  if((x1-x0+1)*(y1-y0+1)>0.97*sw*sh)return null;
  var kx=cv.width/sw,ky=cv.height/sh;
  return{x:Math.round(x0*kx),y:Math.round(y0*ky),w:Math.round((x1-x0+1)*kx),h:Math.round((y1-y0+1)*ky)};
}

async function imgsToPdf(fs){
  nCrop=0;
  var pdf=await PDFLib.PDFDocument.create(),a4=document.querySelector('input[name="pgsz"]:checked').value==="a4";
  for(var i=0;i<fs.length;i++){
    var bmp;
    try{bmp=await createImageBitmap(fs[i])}catch(e){throw new Error("không đọc được ảnh "+fs[i].name+". Hãy dùng ảnh JPG, PNG hoặc WebP.")}
    var s=Math.min(1,3000/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*s),h=Math.round(bmp.height*s);
    var cv=document.createElement("canvas");cv.width=w;cv.height=h;
    var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,w,h);cx.drawImage(bmp,0,0,w,h);
    if(bmp.close)bmp.close();
    if($("smart").checked){
      var r=smartRect(cv);
      if(r){var c2=document.createElement("canvas");c2.width=r.w;c2.height=r.h;c2.getContext("2d").drawImage(cv,r.x,r.y,r.w,r.h,0,0,r.w,r.h);cv=c2;w=r.w;h=r.h;nCrop++}
    }
    var blob=await new Promise(function(r){cv.toBlob(r,"image/jpeg",0.92)});
    var img=await pdf.embedJpg(await blob.arrayBuffer());
    var pw,ph,dw,dh,ox=0,oy=0,k;
    if(a4){
      var land=w>h;pw=land?842:595;ph=land?595:842;
      k=Math.min((pw-40)/w,(ph-40)/h);dw=w*k;dh=h*k;ox=(pw-dw)/2;oy=(ph-dh)/2;
    }else{
      k=842/Math.max(w,h);pw=dw=w*k;ph=dh=h*k;
    }
    pdf.addPage([pw,ph]).drawImage(img,{x:ox,y:oy,width:dw,height:dh});
  }
  return pdf.save();
}

async function mergePdfs(fs){
  var out=await PDFLib.PDFDocument.create();
  for(var i=0;i<fs.length;i++){
    var src;
    try{src=await PDFLib.PDFDocument.load(await fs[i].arrayBuffer())}catch(e){throw new Error("không đọc được "+fs[i].name+". File có thể bị hỏng hoặc đặt mật khẩu.")}
    var pgs=await out.copyPages(src,src.getPageIndices());
    pgs.forEach(function(p){out.addPage(p)});
  }
  return out.save();
}

mkTool("pImg",{
  accept:"image/*",title:"Chọn ảnh để gộp thành PDF",hint:"JPG, PNG, WebP – mỗi ảnh là một trang",out:"Anh-gop",btn:"Gộp ảnh thành PDF",min:1,minMsg:"Hãy chọn ít nhất một ảnh.",
  ok:function(f){return /^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|bmp)$/i.test(f.name)},
  extra:'<label class="opt"><input type="checkbox" id="smart" checked><span>Cắt khung thông minh <span class="sheet">– tự bỏ phần viền thừa quanh nội dung (mặt bàn, nền trống)</span></span></label><h2 style="margin-top:12px">Khổ trang</h2><div class="modes"><label class="mode"><input type="radio" name="pgsz" value="fit" checked><span>Vừa với từng ảnh<small>Mỗi trang có tỉ lệ giống ảnh gốc</small></span></label><label class="mode"><input type="radio" name="pgsz" value="a4"><span>Khổ A4<small>Ảnh thu vừa trang và canh giữa</small></span></label></div>',
  run:imgsToPdf,done:function(n){return "Đã gộp <b>"+n+"</b> ảnh thành file PDF "+n+" trang."+(nCrop?" Đã cắt viền thừa ở <b>"+nCrop+"</b> ảnh.":"")}
});
mkTool("pPdf",{
  accept:".pdf,application/pdf",title:"Chọn các file PDF cần gộp",hint:"Trang cuối file trên nối với trang đầu file dưới",out:"PDF-gop",btn:"Gộp PDF và tải về",min:2,minMsg:"Hãy chọn ít nhất hai file PDF.",
  ok:function(f){return f.type==="application/pdf"||/\.pdf$/i.test(f.name)},
  run:mergePdfs,done:function(n){return "Đã gộp <b>"+n+"</b> file PDF theo thứ tự trong danh sách."}
});
